[package]
name = "neuropulse-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
neuropulse-core = { path = "../neuropulse-core" }
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
gloo-storage = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlVideoElement",
  "HtmlCanvasElement",
  "Navigator",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Performance",
  "KeyboardEvent"
]
