<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <!-- Fundo escuro com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#0d1117" stroke="#1f242e" stroke-width="1.5"/>
  
  <!-- Cérebro estilizado com fluxos e conexões neurais de desempenho (Sem ECG) -->
  <g transform="translate(4, 4)">
    <!-- Hemisfério esquerdo/superior (ondas de processamento e conexões de rede) -->
    <path d="M 28,12 C 18,12 10,18 10,28 C 10,34 14,38 18,40 C 18,44 22,48 28,48 C 30,48 32,46 32,44 C 32,46 34,48 36,48 C 42,48 46,44 46,40 C 50,38 54,34 54,28 C 54,18 46,12 36,12 C 34,12 33,13 32,13.5 C 31,13 30,12 28,12 Z" 
          fill="none" 
          stroke="url(#cogGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.15"/>
          
    <!-- Linhas de fluxo de dados mentais / Conexões e frentes cognitivas (sinapses) -->
    <path d="M 28,15 C 22,15 16,19 15,26 C 14,29 16,32 18,34 C 18,38 21,43 28,43 C 29,43 30,42 31,40.5 M 36,15 C 42,15 48,19 49,26 C 50,29 48,32 46,34 C 46,38 43,43 36,43 C 35,43 34,42 33,40.5" 
          fill="none" 
          stroke="url(#cogGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>
          
    <!-- Conexão Central e Impulso de Decisão / Linhas do Córtex Ativo -->
    <path d="M 25,28 C 26,24 29,22 32,22 C 35,22 38,24 39,28 C 39,32 36,36 32,36 C 28,36 25,32 25,28 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round"/>
          
    <!-- Nós e Pontos de Disparo Cognitivo (Atividade de Tarefa) -->
    <circle cx="15" cy="26" r="2.5" fill="#00f2fe"/>
    <circle cx="49" cy="26" r="2.5" fill="#00f2fe"/>
    <circle cx="28" cy="15" r="2" fill="#ffffff"/>
    <circle cx="36" cy="15" r="2" fill="#ffffff"/>
    <circle cx="32" cy="22" r="2" fill="#00f2fe"/>
    <circle cx="32" cy="36" r="2" fill="#00f2fe"/>
    <circle cx="28" cy="43" r="2.5" fill="#4facfe"/>
    <circle cx="36" cy="43" r="2.5" fill="#4facfe"/>
  </g>
</svg>
